<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020402;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Calculator/Accounting symbol - Dollar sign with chart -->
  <g transform="translate(256, 256)">
    <!-- Dollar sign -->
    <path d="M -80 -120 L -80 -80 L -40 -80 L -40 -60 L -80 -60 L -80 60 L -40 60 L -40 80 L -80 80 L -80 120 L -40 120 L -40 80 L 40 80 L 40 60 L -40 60 L -40 -60 L 40 -60 L 40 -80 L -40 -80 L -40 -120 Z" 
          fill="url(#emeraldGradient)" 
          stroke="#34d399" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Chart bars representing growth -->
    <rect x="-140" y="40" width="24" height="60" rx="4" fill="#34d399" opacity="0.8"/>
    <rect x="-100" y="20" width="24" height="80" rx="4" fill="#34d399" opacity="0.9"/>
    <rect x="-60" y="0" width="24" height="100" rx="4" fill="#34d399"/>
    <rect x="-20" y="10" width="24" height="90" rx="4" fill="#34d399" opacity="0.95"/>
    <rect x="20" y="30" width="24" height="70" rx="4" fill="#34d399" opacity="0.85"/>
    <rect x="60" y="50" width="24" height="50" rx="4" fill="#34d399" opacity="0.75"/>
    <rect x="100" y="70" width="24" height="30" rx="4" fill="#34d399" opacity="0.7"/>
  </g>
  
  <!-- Golden accent line -->
  <line x1="100" y1="100" x2="412" y2="412" stroke="#fbbf24" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
</svg>
