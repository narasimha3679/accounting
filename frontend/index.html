  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do you offer a free Canadian income tax calculator?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Cashual includes a free 2026 Canadian income tax calculator at cashual.org/tax-calculator—no account required. It estimates Ontario take-home pay using federal and provincial brackets, CPP, CPP2, EI, and the Ontario Health Premium."
          }
        },
        {
          "@type": "Question",
          "name": "Is Cashual CRA compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, absolutely. Cashual's tax calculations and document generation are built to meet all Canada Revenue Agency requirements. Our system automatically handles CPP, EI, income tax, and provincial tax calculations according to current CRA guidelines. All generated documents (T4s, T5s, ROEs) are formatted to CRA specifications."
          }
        },
        {
          "@type": "Question",
          "name": "How does pricing work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cashual offers simple, transparent pricing: $5 per month or $50 per year (save 17% with annual billing). This includes all features—accounting, payroll, tax documents, and employee management. No hidden fees, no per-employee charges. Cancel anytime with no long-term commitments."
          }
        },
        {
          "@type": "Question",
          "name": "Can I import data from other accounting systems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, we're working on import capabilities for common accounting formats. Currently, you can manually enter your data, and we're developing CSV import features for transactions, employee data, and historical records. If you need to migrate from a specific system, contact our support team for assistance."
          }
        },
        {
          "@type": "Question",
          "name": "What if I need help or have questions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer comprehensive support through multiple channels. You can access our knowledge base, contact support via email, or schedule a one-on-one onboarding call. We're responsive to feedback and feature requests. Our goal is to make sure you're successful with Cashual."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Security is our top priority. We use bank-level encryption, secure data storage, and follow industry best practices for data protection. Your financial data is encrypted both in transit and at rest. We're compliant with Canadian privacy laws (PIPEDA) and never share your data with third parties."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Cashual for multiple companies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Cashual supports multiple companies. You can manage payroll, expenses, and tax documents for multiple businesses from a single account. Each company maintains separate records, employees, and financial data. This is especially useful for consultants or contractors who operate multiple incorporated entities."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need accounting knowledge to use Cashual?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No accounting degree required! Cashual is designed to be intuitive for business owners who aren't accountants. We provide clear guidance, helpful tooltips, and automatic calculations. However, for complex tax situations, we always recommend consulting with a professional accountant."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I make a mistake?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cashual makes it easy to correct mistakes. You can edit payroll runs, adjust employee information, and regenerate documents as needed. We also maintain an audit trail so you can see what changed and when. If you've already submitted documents to the CRA, we provide guidance on how to file corrections."
          }
        }
      ]
