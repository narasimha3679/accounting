name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  DIST_ARTIFACT: frontend-dist

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_STORAGE_BUCKET: ${{ secrets.VITE_SUPABASE_STORAGE_BUCKET }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to cloud VM
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      POST_DEPLOY_COMMAND: ${{ secrets.POST_DEPLOY_COMMAND }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: dist

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync bundle to VM
        env:
          PORT: ${{ env.DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "Missing required SSH secret (DEPLOY_USER, DEPLOY_HOST, DEPLOY_PATH)."
            exit 1
          fi

          SSH_PORT="${PORT:-22}"
          
          # Create target directory if it doesn't exist
          echo "Ensuring target directory exists..."
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}"
          
          # Verify directory was created and has write permissions
          if ! ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "test -w ${DEPLOY_PATH}"; then
            echo "Error: Target directory ${DEPLOY_PATH} is not writable"
            exit 1
          fi
          
          echo "Syncing files to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}..."
          rsync -az --delete -e "ssh -p $SSH_PORT" dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Run post-deploy hook
        if: env.POST_DEPLOY_COMMAND != ''
        run: |
          SSH_PORT="${DEPLOY_PORT:-22}"
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "$POST_DEPLOY_COMMAND"
